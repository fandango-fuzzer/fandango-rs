[package]
name = "lm3s6965-demo"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rtic = "1.1.3"
cortex-m-semihosting = { version = "0.5.0" }
embedded-alloc = { git = "https://github.com/rust-embedded/embedded-alloc.git", rev = "89cb8d50e6634130302cd444b3f547aed0fd32dc" }
fandango = { path = ".." }
fandango-runtime = { path = "../runtime" }
fandango-targets = { path = "../targets", features = ["xml"] }
lm3s6965 = { git = "https://github.com/japaric/lm3s6965.git", rev = "facf63aa0169c773175a143f6014a1d0977fb74f" }
panic-semihosting = { version = "0.6.0", features = ["exit"] }
rand = { version = "0.9.0", default-features = false, features = ["std_rng"] }

[profile.dev]
opt-level = "z"
strip = true
lto = true
debug-assertions = false

[profile.release]
opt-level = "z"
strip = true
lto = true

[workspace]
members = ["."]