name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          #          - stable
          #          - beta
          - nightly
    env:
      RUSTFLAGS: -Znext-solver
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y libfontconfig-dev pkg-config
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --verbose --workspace --benches --tests --examples
      - name: Run tests
        run: cargo test --verbose --workspace
      - name: Build no_opt_indirect
        env:
          RUSTFLAGS: -Znext-solver --cfg=no_opt_indirect
        run: cargo build --verbose --workspace --benches --tests --examples

  fmt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          #          - stable
          - nightly
    env:
      RUSTFLAGS: -Znext-solver
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add rustfmt
      - name: Format
        run: cargo fmt --check

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          #          - stable
          - nightly
    env:
      RUSTFLAGS: -Znext-solver
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install -y libfontconfig-dev pkg-config
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - name: Clippy
        run: cargo clippy --all-features --workspace --tests --benches --examples -- -D warnings
      - name: Clippy no_opt_indirect
        env:
          RUSTFLAGS: -Znext-solver --cfg=no_opt_indirect
        run: cargo clippy --all-features --workspace --tests --benches --examples -- -D warnings

  lm3s6965:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - nightly
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - run: rustup target add thumbv7m-none-eabi
      - name: Build
        run: cd demos/lm3s6965-demo && cargo build && cargo clippy --all-features --workspace -- -D warnings

  libafl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - nightly
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - run: cargo install just
      - run: cd demos/libafl-demo && just fuzzer