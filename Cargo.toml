[package]
name = "fandango"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
fandango-core = { path = "core" }
fandango-derive = { path = "derive" }

[dev-dependencies]
trybuild.workspace = true

[workspace]
members = [".", "core", "derive", "generator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Addison Crump <addison.crump@cispa.de>"]

[workspace.dependencies]
getset = "0.1.3"
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.6.5"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
trybuild = "1.0"
