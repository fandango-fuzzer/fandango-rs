[package]
name = "clang"
version = "0.0.0"
edition = "2024"
publish = false

[features]
static_defs = ["common/static_defs", "fandango-targets/static_defs"]

[dependencies]
fandango = { path = "../.." }
fandango-runtime = { path = "../../runtime" }
fandango-targets = { path = "../../targets", features = ["clang"] }

common = { path = "../common" }

[lints]
workspace = true
