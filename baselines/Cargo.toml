[package]
name = "baselines"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["static_defs"]
static_defs = [
    "common/static_defs",
    "csv/static_defs",
    "rest/static_defs",
    "scriptsizec/static_defs",
    "xml/static_defs",
    "fandango-targets/static_defs"
]

[dependencies]
fandango.workspace = true
fandango-targets.workspace = true

common = { path = "common" }

criterion.workspace = true
rand.workspace = true

[dev-dependencies]
csv = { path = "csv" }
rest = { path = "rest" }
scriptsizec = { path = "scriptsizec" }
xml = { path = "xml" }

[profile.release]
codegen-units = 1
lto = true

[profile.bench]
inherits = "release"
debug = true
opt-level = 3

[profile.bench-noopt]
inherits = "dev"
debug-assertions = false
overflow-checks = false

[workspace]
members = [".", "analysis", "common", "csv", "rest", "scriptsizec", "xml"]
resolver = "3"

[workspace.lints.rust]
bindings_with_variant_name = "allow"
type_alias_bounds = "allow"
deprecated = "allow"

missing_docs = "warn"

[workspace.dependencies]
fandango = { path = ".." }
fandango-targets = { path = "../targets", default-features = false }

serde_csv = { version = "1.3.1", package = "csv" } # rename due to conflict
criterion = { version = "0.6.0", features = ["html_reports"] }
hashbrown = { version = "0.15.2", default-features = false }
linfa = "0.7.1"
linfa-linear = "0.7.1"
ndarray = "0.15.6" # based on what linfa supports
plotters = "0.3.7"
rand = { version = "0.9.1", default-features = false }
serde = "1.0"
serde_json = "1.0"

[[bench]]
name = "baselines"
path = "benches/baselines.rs"
harness = false

[lints]
workspace = true
