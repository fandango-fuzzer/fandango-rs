[package]
name = "baselines"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["static_defs"]
static_defs = [
    "common/static_defs",
    "csv/static_defs",
    "rest/static_defs",
    "scriptsizec/static_defs",
    "xml/static_defs",
    "fandango-targets/static_defs",
    "lang/static_defs"
]

[dependencies]
fandango = { path = ".." }
fandango-runtime = { path = "../runtime" }

common = { path = "common" }

hashbrown = { workspace = true, features = ["serde"] }
linfa.workspace = true
linfa-linear = { workspace = true, features = ["serde"] }
ndarray.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
csv = { path = "csv" }
rest = { path = "rest" }
scriptsizec = { path = "scriptsizec" }
xml = { path = "xml" }
lang = { path = "lang" }

[[bench]]
name = "models"
path = "benches/models.rs"
harness = false

[lints]
workspace = true