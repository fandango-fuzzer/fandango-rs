[package]
name = "baselines"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["static_defs"]
static_defs = [
    "common/static_defs",
    "csv/static_defs",
    "rest/static_defs",
    "scriptsizec/static_defs",
    "xml/static_defs",
    "fandango-targets/static_defs"
]

[dependencies]
fandango.workspace = true
fandango-targets.workspace = true

csv = { path = "csv" }
rest = { path = "rest" }
scriptsizec = { path = "scriptsizec" }
xml = { path = "xml" }

common = { path = "common" }

criterion.workspace = true
rand.workspace = true

[profile.release]
codegen-units = 1
lto = true

[profile.bench]
inherits = "release"
debug = true
opt-level = 3

[profile.bench-noopt]
inherits = "dev"
debug-assertions = false
overflow-checks = false

[workspace]
members = [".", "common", "csv", "rest", "scriptsizec", "xml"]
resolver = "3"

[workspace.lints.rust]
bindings_with_variant_name = "allow"
type_alias_bounds = "allow"
deprecated = "allow"

missing_docs = "warn"

[workspace.dependencies]
fandango = { path = ".." }
fandango-targets = { path = "../targets", default-features = false }

criterion = { version = "0.6.0", features = ["html_reports"] }
hashbrown = { version = "0.15.2", default-features = false }
rand = { version = "0.9.1", default-features = false }

[[bench]]
name = "baselines"
path = "benches/baselines.rs"
harness = false

[lints]
workspace = true